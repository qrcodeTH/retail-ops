# Render Blueprint: declares the whole deployment in the repo (infrastructure as code)
# Dashboard -> New -> Blueprint -> pick this repo -> Apply. Every push to main redeploys.
services:
  - type: web
    name: retail-ops-api
    runtime: docker
    plan: free
    region: singapore              # closest region to Thailand
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health       # Render only routes traffic once this returns 200
    envVars:
      - key: NODE_ENV
        value: production
      - key: SEED_ON_BOOT          # demo only: free tier has no shell, so seed on start (idempotent)
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: retail-ops-db
          property: connectionString

databases:
  - name: retail-ops-db
    plan: free                     # 1 GB, expires 30 days after creation — fine for the demo
    region: singapore
    postgresMajorVersion: "16"
    databaseName: retail_ops
    user: retail
